# Reference config for `ccc training --config configs/<file>.yaml`.
#
# Two top-level keys, both optional:
#   base:   dotted BeeCombConfig path -> single value (applies to every run)
#   sweep:  dotted BeeCombConfig path -> list of values (cartesian product = one run per combination)
#
# Every path below is listed with its code default (src/core/config/config.py).
# All commented out: as-is this file runs a single run with pure defaults.
# Copy it, uncomment what you want to change — the rest keeps following the code.

